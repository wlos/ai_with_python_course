<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">How K-means clustering works</title>
  <desc id="description">Three panels show initial centroids, assignment of observations to their nearest centroid, and updated centroids after repeating the process.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#fff9f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60798d"/>
    </marker>
    <symbol id="centroid" viewBox="-14 -14 28 28">
      <path d="M0,-13 L3.8,-4.2 L13,-4 L5.4,1.8 L7.9,11 L0,6 L-7.9,11 L-5.4,1.8 L-13,-4 L-3.8,-4.2 Z"/>
    </symbol>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#background)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#19324d">How K-means Clustering Works</text>
  <text x="600" y="87" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#526a7d">Assign observations to the nearest centroid, update the centroids, and repeat</text>

  <!-- Panel backgrounds -->
  <g filter="url(#shadow)">
    <rect x="55" y="125" width="320" height="440" rx="22" fill="#ffffff" stroke="#d7e2ea" stroke-width="2"/>
    <rect x="440" y="125" width="320" height="440" rx="22" fill="#ffffff" stroke="#d7e2ea" stroke-width="2"/>
    <rect x="825" y="125" width="320" height="440" rx="22" fill="#ffffff" stroke="#d7e2ea" stroke-width="2"/>
  </g>

  <!-- Arrows between panels -->
  <line x1="388" y1="345" x2="426" y2="345" stroke="#60798d" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="773" y1="345" x2="811" y2="345" stroke="#60798d" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Panel headings -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="215" y="165" font-size="23" font-weight="700" fill="#25455f">1. Initialise</text>
    <text x="215" y="192" font-size="16" fill="#60798d">choose k = 3 starting centroids</text>
    <text x="600" y="165" font-size="23" font-weight="700" fill="#25455f">2. Assign</text>
    <text x="600" y="192" font-size="16" fill="#60798d">use the nearest centroid</text>
    <text x="985" y="165" font-size="23" font-weight="700" fill="#25455f">3. Update and Repeat</text>
    <text x="985" y="192" font-size="16" fill="#60798d">move centroids to cluster means</text>
  </g>

  <!-- Panel 1: unlabelled observations -->
  <g fill="#aebdca" stroke="#ffffff" stroke-width="2">
    <circle cx="120" cy="275" r="9"/><circle cx="145" cy="250" r="9"/><circle cx="158" cy="290" r="9"/><circle cx="184" cy="265" r="9"/><circle cx="132" cy="320" r="9"/><circle cx="178" cy="315" r="9"/>
    <circle cx="250" cy="240" r="9"/><circle cx="282" cy="258" r="9"/><circle cx="305" cy="235" r="9"/><circle cx="270" cy="300" r="9"/><circle cx="318" cy="288" r="9"/><circle cx="298" cy="320" r="9"/>
    <circle cx="190" cy="410" r="9"/><circle cx="220" cy="390" r="9"/><circle cx="248" cy="420" r="9"/><circle cx="205" cy="455" r="9"/><circle cx="258" cy="465" r="9"/><circle cx="230" cy="495" r="9"/>
  </g>
  <use href="#centroid" x="112" y="215" width="28" height="28" fill="#2f80b7" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="311" y="345" width="28" height="28" fill="#e4772e" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="142" y="453" width="28" height="28" fill="#3b9460" stroke="#ffffff" stroke-width="2"/>

  <!-- Panel 2: coloured assignments -->
  <g stroke="#ffffff" stroke-width="2">
    <g fill="#4a9bd0"><circle cx="505" cy="275" r="9"/><circle cx="530" cy="250" r="9"/><circle cx="543" cy="290" r="9"/><circle cx="569" cy="265" r="9"/><circle cx="517" cy="320" r="9"/><circle cx="563" cy="315" r="9"/></g>
    <g fill="#ef914f"><circle cx="635" cy="240" r="9"/><circle cx="667" cy="258" r="9"/><circle cx="690" cy="235" r="9"/><circle cx="655" cy="300" r="9"/><circle cx="703" cy="288" r="9"/><circle cx="683" cy="320" r="9"/></g>
    <g fill="#54a875"><circle cx="575" cy="410" r="9"/><circle cx="605" cy="390" r="9"/><circle cx="633" cy="420" r="9"/><circle cx="590" cy="455" r="9"/><circle cx="643" cy="465" r="9"/><circle cx="615" cy="495" r="9"/></g>
  </g>
  <use href="#centroid" x="497" y="215" width="28" height="28" fill="#2f80b7" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="696" y="345" width="28" height="28" fill="#e4772e" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="527" y="453" width="28" height="28" fill="#3b9460" stroke="#ffffff" stroke-width="2"/>
  <path d="M516 242 Q540 245 555 268" fill="none" stroke="#2f80b7" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M706 373 Q690 340 674 300" fill="none" stroke="#e4772e" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M541 468 Q570 455 596 438" fill="none" stroke="#3b9460" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>

  <!-- Panel 3: converged clusters and updated centroids -->
  <g opacity="0.16">
    <circle cx="927" cy="286" r="78" fill="#4a9bd0"/>
    <circle cx="1068" cy="276" r="78" fill="#ef914f"/>
    <circle cx="1000" cy="438" r="82" fill="#54a875"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <g fill="#4a9bd0"><circle cx="890" cy="275" r="9"/><circle cx="915" cy="250" r="9"/><circle cx="928" cy="290" r="9"/><circle cx="954" cy="265" r="9"/><circle cx="902" cy="320" r="9"/><circle cx="948" cy="315" r="9"/></g>
    <g fill="#ef914f"><circle cx="1020" cy="240" r="9"/><circle cx="1052" cy="258" r="9"/><circle cx="1075" cy="235" r="9"/><circle cx="1040" cy="300" r="9"/><circle cx="1088" cy="288" r="9"/><circle cx="1068" cy="320" r="9"/></g>
    <g fill="#54a875"><circle cx="960" cy="410" r="9"/><circle cx="990" cy="390" r="9"/><circle cx="1018" cy="420" r="9"/><circle cx="975" cy="455" r="9"/><circle cx="1028" cy="465" r="9"/><circle cx="1000" cy="495" r="9"/></g>
  </g>
  <use href="#centroid" x="913" y="272" width="28" height="28" fill="#2f80b7" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="1054" y="262" width="28" height="28" fill="#e4772e" stroke="#ffffff" stroke-width="2"/>
  <use href="#centroid" x="986" y="424" width="28" height="28" fill="#3b9460" stroke="#ffffff" stroke-width="2"/>

  <!-- Legend and convergence note -->
  <rect x="245" y="608" width="710" height="58" rx="18" fill="#ffffff" stroke="#d4dee5"/>
  <circle cx="305" cy="637" r="9" fill="#7e93a4"/>
  <text x="325" y="643" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#40586b">observation</text>
  <use href="#centroid" x="438" y="623" width="28" height="28" fill="#cf7638"/>
  <text x="475" y="643" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#40586b">centroid</text>
  <text x="610" y="643" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#25455f">Stop when assignments or centroids no longer change.</text>
</svg>
