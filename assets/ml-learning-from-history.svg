<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 90 1200 510" role="img" aria-labelledby="title description">
  <title id="title">Machine learning learns an input-output relationship from historical data</title>
  <desc id="description">Historical input-output examples become model parameters through learning methods. The trained model then maps a new input to an output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f7f9ff"/>

  <text x="70" y="143" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173b93">USE THE TRAINED MODEL</text>
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="230" height="120" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
    <rect x="470" y="150" width="260" height="150" rx="24" fill="#2457d6"/>
    <rect x="900" y="165" width="230" height="120" rx="22" fill="#ffffff" stroke="#9bb3ef" stroke-width="3"/>
  </g>
  <text x="185" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173b93">NEW INPUT</text>
  <text x="185" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#5c6577">a case not seen before</text>
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">ML MODEL</text>
  <text x="600" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e8eeff">learnt relationship</text>
  <text x="1015" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173b93">OUTPUT</text>
  <text x="1015" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#5c6577">prediction or decision</text>
  <path d="M310 214 H395 V195 L450 225 L395 255 V236 H310 Z" fill="#173b93" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M740 214 H825 V195 L880 225 L825 255 V236 H740 Z" fill="#173b93" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <line x1="70" y1="345" x2="1130" y2="345" stroke="#dbe4f6" stroke-width="3"/>
  <text x="70" y="395" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2f855a">LEARN FROM HISTORY</text>
  <g filter="url(#shadow)">
    <rect x="30" y="420" width="260" height="145" rx="22" fill="#ffffff" stroke="#8cc6a6" stroke-width="3"/>
    <rect x="480" y="420" width="240" height="145" rx="22" fill="#ffffff" stroke="#8cc6a6" stroke-width="3"/>
  </g>
  <text x="160" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#236443">HISTORICAL DATA</text>
  <text x="160" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">past inputs + known outputs</text>
  <text x="160" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5c6577">examples of the relationship</text>
  <text x="385" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#236443">LEARNING METHODS</text>
  <text x="600" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#236443">PARAMETERS</text>
  <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">a compressed learnt</text>
  <text x="600" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">input–output relationship</text>
  <path d="M300 484 H427 V470 L472 492 L427 514 V500 H300 Z" fill="#236443" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M590 415 V346 H575 L600 307 L625 346 H610 V415 Z" fill="#236443" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
</svg>
