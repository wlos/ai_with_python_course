<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Regression, classification and clustering comparison</title>
  <desc id="description">Three panels compare continuous numeric prediction, known class prediction and unsupervised group discovery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#fff9f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3557" flood-opacity="0.14"/>
    </filter>
    <symbol id="centroid" viewBox="-14 -14 28 28">
      <path d="M0,-13 L3.8,-4.2 L13,-4 L5.4,1.8 L7.9,11 L0,6 L-7.9,11 L-5.4,1.8 L-13,-4 L-3.8,-4.2 Z"/>
    </symbol>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#background)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700" fill="#19324d">Regression VS Classification VS Clustering</text>
  <text x="600" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#526a7d">The target and learning objective determine the task</text>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="118" width="350" height="525" rx="22" fill="#ffffff" stroke="#cfe0eb" stroke-width="2"/>
    <rect x="425" y="118" width="350" height="525" rx="22" fill="#ffffff" stroke="#e2d6ef" stroke-width="2"/>
    <rect x="805" y="118" width="350" height="525" rx="22" fill="#ffffff" stroke="#d5e8da" stroke-width="2"/>
  </g>

  <!-- Card headings and learning type tags -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="220" y="163" font-size="26" font-weight="700" fill="#245979">Regression</text>
    <rect x="153" y="179" width="134" height="30" rx="15" fill="#dceeff"/>
    <text x="220" y="200" font-size="15" font-weight="700" fill="#245979">SUPERVISED</text>

    <text x="600" y="163" font-size="26" font-weight="700" fill="#604386">Classification</text>
    <rect x="533" y="179" width="134" height="30" rx="15" fill="#e9def7"/>
    <text x="600" y="200" font-size="15" font-weight="700" fill="#604386">SUPERVISED</text>

    <text x="980" y="163" font-size="26" font-weight="700" fill="#326d47">Clustering</text>
    <rect x="909" y="179" width="142" height="30" rx="15" fill="#dff1e4"/>
    <text x="980" y="200" font-size="15" font-weight="700" fill="#326d47">UNSUPERVISED</text>
  </g>

  <!-- Regression plot -->
  <g>
    <line x1="105" y1="430" x2="345" y2="430" stroke="#8ba0af" stroke-width="2"/>
    <line x1="105" y1="430" x2="105" y2="245" stroke="#8ba0af" stroke-width="2"/>
    <line x1="118" y1="411" x2="333" y2="264" stroke="#e4772e" stroke-width="5" stroke-linecap="round"/>
    <g fill="#4a9bd0" stroke="#ffffff" stroke-width="2">
      <circle cx="125" cy="393" r="9"/><circle cx="148" cy="384" r="9"/><circle cx="171" cy="350" r="9"/><circle cx="198" cy="361" r="9"/>
      <circle cx="222" cy="325" r="9"/><circle cx="246" cy="303" r="9"/><circle cx="274" cy="312" r="9"/><circle cx="300" cy="277" r="9"/><circle cx="326" cy="270" r="9"/>
    </g>
    <line x1="286" y1="430" x2="286" y2="296" stroke="#60798d" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="286" cy="296" r="9" fill="#ffffff" stroke="#e4772e" stroke-width="4"/>
    <text x="292" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#526a7d">new x</text>
    <text x="220" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#245979">Output: a number</text>
    <text x="220" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#526a7d">for example, $342,000</text>
  </g>

  <!-- Classification plot -->
  <g>
    <rect x="485" y="245" width="230" height="185" rx="14" fill="#fafcff" stroke="#dbe5ec"/>
    <path d="M485 430 L485 245 L715 245 Z" fill="#dceeff" opacity="0.75"/>
    <path d="M485 430 L715 245 L715 430 Z" fill="#f8dfcf" opacity="0.78"/>
    <line x1="493" y1="420" x2="707" y2="252" stroke="#7251a2" stroke-width="4" stroke-dasharray="8 6"/>
    <g fill="#4a9bd0" stroke="#ffffff" stroke-width="2">
      <circle cx="520" cy="282" r="9"/><circle cx="550" cy="300" r="9"/><circle cx="535" cy="340" r="9"/><circle cx="580" cy="330" r="9"/><circle cx="555" cy="382" r="9"/>
    </g>
    <g fill="#ef914f" stroke="#ffffff" stroke-width="2">
      <circle cx="635" cy="280" r="9"/><circle cx="676" cy="300" r="9"/><circle cx="650" cy="345" r="9"/><circle cx="690" cy="375" r="9"/><circle cx="620" cy="395" r="9"/>
    </g>
    <circle cx="660" cy="360" r="12" fill="#ffffff" stroke="#604386" stroke-width="4"/>
    <text x="600" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#604386">Output: a known class</text>
    <text x="600" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#526a7d">for example, approved</text>
  </g>

  <!-- Clustering plot -->
  <g>
    <circle cx="895" cy="305" r="66" fill="#dceeff" opacity="0.75"/>
    <circle cx="1062" cy="301" r="66" fill="#f8dfcf" opacity="0.78"/>
    <circle cx="980" cy="403" r="67" fill="#dff1e4" opacity="0.82"/>
    <g stroke="#ffffff" stroke-width="2">
      <g fill="#4a9bd0"><circle cx="868" cy="280" r="9"/><circle cx="900" cy="268" r="9"/><circle cx="920" cy="300" r="9"/><circle cx="880" cy="330" r="9"/><circle cx="915" cy="338" r="9"/></g>
      <g fill="#ef914f"><circle cx="1035" cy="270" r="9"/><circle cx="1070" cy="267" r="9"/><circle cx="1093" cy="300" r="9"/><circle cx="1042" cy="325" r="9"/><circle cx="1078" cy="338" r="9"/></g>
      <g fill="#54a875"><circle cx="950" cy="385" r="9"/><circle cx="985" cy="372" r="9"/><circle cx="1013" cy="402" r="9"/><circle cx="965" cy="430" r="9"/><circle cx="1000" cy="443" r="9"/></g>
    </g>
    <use href="#centroid" x="881" y="291" width="28" height="28" fill="#2f80b7" stroke="#ffffff" stroke-width="2"/>
    <use href="#centroid" x="1048" y="287" width="28" height="28" fill="#e4772e" stroke="#ffffff" stroke-width="2"/>
    <use href="#centroid" x="966" y="389" width="28" height="28" fill="#3b9460" stroke="#ffffff" stroke-width="2"/>
    <text x="980" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#326d47">Output: discovered groups</text>
    <text x="980" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#526a7d">cluster 0, cluster 1, cluster 2</text>
  </g>

  <!-- Target comparison -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <line x1="75" y1="535" x2="365" y2="535" stroke="#d7e2ea"/>
    <line x1="455" y1="535" x2="745" y2="535" stroke="#d7e2ea"/>
    <line x1="835" y1="535" x2="1125" y2="535" stroke="#d7e2ea"/>
    <text x="220" y="570" font-size="16" fill="#526a7d">Target y</text>
    <text x="220" y="600" font-size="19" font-weight="700" fill="#245979">continuous value</text>
    <text x="600" y="570" font-size="16" fill="#526a7d">Target y</text>
    <text x="600" y="600" font-size="19" font-weight="700" fill="#604386">category label</text>
    <text x="980" y="570" font-size="16" fill="#526a7d">Target y</text>
    <text x="980" y="600" font-size="19" font-weight="700" fill="#326d47">not used in training</text>
  </g>
</svg>
