project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "Session*.ipynb"

website:
  title: "Introduction to AI with Python"
  site-url: "https://wlos.github.io/ai_with_python_course/"
  repo-url: "https://github.com/wlos/ai_with_python_course"
  repo-actions:
    - source
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
  sidebar:
    style: floating
    search: true
    contents:
      - index.qmd
      - section: "Course Sessions"
        contents:
          - "Session2 Python Foundations and Algebra.ipynb"
          - "Session3 Selection and Boolean Logic.ipynb"
          - "Session4 Iteration, Program Libraries and Functions.ipynb"
          - "Session5-6 Function Design and Algorithm Design.ipynb"
          - "Session7-8 Strings and Data Structures.ipynb"
          - "Session9 Programming for Maqueen Robot.ipynb"
          - "Session11 Introduction to AI.ipynb"
  page-footer:
    left: "Introduction to AI with Python course materials"
    right:
      - icon: github
        href: "https://github.com/wlos/ai_with_python_course"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
