<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title desc">
<title id="title">Transfer learning: train a new head</title>
<desc id="desc">Load pretrained ResNet18, replace its head and prepare inputs. Configure parameter gradients, optimiser parameters and layer running modes, then train the head.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2457d6"/></marker></defs>
<rect width="760" height="750" rx="20" fill="#f4f7ff"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033">
<text x="380" y="42" font-size="25" font-weight="bold">Transfer learning: train a new head</text>
<rect x="60" y="70" width="640" height="88" rx="12" fill="#e8f2ff" stroke="#d0dced"/>
<text x="380" y="105" font-size="21" font-weight="bold">1. Load pretrained ResNet18</text>
<text x="380" y="135" text-anchor="middle" font-size="17">Start with ImageNet weights</text>
<path d="M380 159 V181" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="640" height="88" rx="12" fill="#e8f2ff" stroke="#d0dced"/>
<text x="380" y="225" font-size="21" font-weight="bold">2. Replace the classification head</text>
<text x="380" y="255" text-anchor="middle" font-size="17">New Linear layer: 10 digit classes</text>
<path d="M380 279 V301" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="640" height="88" rx="12" fill="#e8f2ff" stroke="#d0dced"/>
<text x="380" y="345" font-size="21" font-weight="bold">3. Prepare inputs</text>
<text x="380" y="375" text-anchor="middle" font-size="17">RGB → pretrained transforms → device</text>
<path d="M380 399 V421" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="430" width="640" height="168" rx="12" fill="#eaf6ee" stroke="#d0dced"/>
<text x="380" y="465" font-size="21" font-weight="bold">4. Configure training</text>
<text x="380" y="503" text-anchor="middle" font-size="17">Set parameter gradients: requires_grad</text>
<text x="380" y="537" text-anchor="middle" font-size="17">Select parameters for the optimiser</text>
<text x="380" y="571" text-anchor="middle" font-size="17">Set layer modes: train() / eval()</text>
<path d="M380 599 V621" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="630" width="640" height="88" rx="12" fill="#e8f2ff" stroke="#d0dced"/>
<text x="380" y="665" font-size="21" font-weight="bold">5. Train the head</text>
<text x="380" y="695" text-anchor="middle" font-size="17">Forward → loss → backward → update</text>
</g></svg>
